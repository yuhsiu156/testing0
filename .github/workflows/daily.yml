name: Daily TW stock analysis
on:
  schedule:
    # UTC 08:30 = 台灣 16:30，週一到週五；台股若遇休市不新增新日期。
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python update_daily.py
      - name: Commit daily snapshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.csv data/history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update daily stock signals"
            git push
          fi
